[platformio]
default_envs = left_teensy32

[env:left_teensy32]
platform = teensy@5.0.0
board = teensy31
framework = arduino
build_flags = -D USB_SERIAL
build_src_filter = +<main.cpp> -<blink.cpp>
upload_port = /dev/ttyACM4
monitor_speed = 115200
; Never use the generic Teensy soft reboot: multiple Teensys are connected.
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/upload_left.py" --port "$UPLOAD_PORT" --uploader "$PROJECT_PACKAGES_DIR/tool-teensy/teensy_loader_cli" --firmware "$SOURCE"

[env:left_blink]
extends = env:left_teensy32
build_src_filter = -<main.cpp> +<blink.cpp>

[env:left_blink_auto]
extends = env:left_blink
; Explicit no-button test: refuse unless left encoder is the ONLY connected Teensy.
upload_command = "$PYTHONEXE" "$PROJECT_DIR/upload_left.py" --soft-reboot --port "$UPLOAD_PORT" --uploader "$PROJECT_PACKAGES_DIR/tool-teensy/teensy_loader_cli" --firmware "$SOURCE"

[env:left_encoder_auto]
extends = env:left_teensy32
; Restore encoder code while the main control Teensy remains disconnected.
upload_command = "$PYTHONEXE" "$PROJECT_DIR/upload_left.py" --soft-reboot --port "$UPLOAD_PORT" --uploader "$PROJECT_PACKAGES_DIR/tool-teensy/teensy_loader_cli" --firmware "$SOURCE"
