[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_port = /dev/teensy
monitor_speed = 460800
lib_deps = nrf24/RF24@^1.5.0
upload_protocol = teensy-cli
build_src_filter = +<teensy_main_20261003_wifi.cpp>
build_flags =
    -DSERIAL_TX_BUFFER_SIZE=1024
    -DSERIAL_RX_BUFFER_SIZE=1024
