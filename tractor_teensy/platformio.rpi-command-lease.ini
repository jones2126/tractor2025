[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_port = /dev/teensy
monitor_speed = 460800
lib_deps = nrf24/RF24@^1.5.0
upload_protocol = teensy-cli
; Opt-in build only. Do not copy over platformio.ini or upload without the
; separately approved motor-off test procedure.
build_src_filter = +<teensy_main_20261031_rpi_command_lease.cpp>
build_flags =
    -DSERIAL_TX_BUFFER_SIZE=1024
    -DSERIAL_RX_BUFFER_SIZE=1024
