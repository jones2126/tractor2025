; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41
src_dir = src

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_port = /dev/teensy
;monitor_speed = 921600
; 460800
monitor_speed = 460800

upload_protocol = teensy-cli
; Build only the consolidated RPi-command-lease firmware. Superseded dated
; sources are retained under src/archive and cannot enter this build.
build_src_filter =
    -<*>
    +<teensy_main_20261110.cpp>
build_flags =
    -DSERIAL_TX_BUFFER_SIZE=1024
    -DSERIAL_RX_BUFFER_SIZE=1024
